# Stands in for S3. moto serves every API from this one port and does
# path-style addressing, which is why the content store is configured with
# FINERACT_CONTENT_S3_PATH_STYLE_ADDRESSING_ENABLED=true.
services:
  moto:
    image: motoserver/moto:${MOTO_VERSION:-latest}
    environment:
      MOTO_PORT: "5000"
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
